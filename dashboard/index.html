<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sentinel</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegação">
      <a class="brand" id="brand" href="#/" aria-label="Sentinel — visão geral"></a>
      <button class="palette-trigger" id="palette-open" type="button">
        <span class="palette-trigger-label">Buscar ou executar</span>
        <kbd id="palette-hint">Ctrl K</kbd>
      </button>
      <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-foot">
        <span id="live-status" class="pill pill-muted" role="status">Conectando…</span>
        <button id="logout" class="link-button" type="button">Sair</button>
      </div>
    </aside>

    <div class="main">
      <header class="mobilebar">
        <button id="menu-toggle" class="icon-button" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"></button>
        <span class="mobile-brand" id="mobile-brand">Sentinel</span>
      </header>
      <div id="banner" class="banner" hidden role="alert"></div>
      <main id="view" class="view" tabindex="-1">
        <div class="loading" aria-label="Carregando"><span></span><span></span><span></span></div>
      </main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <dialog class="palette" id="palette" aria-label="Paleta de comandos"></dialog>
  <div id="tooltip" class="tooltip" hidden></div>
</body>
</html>
