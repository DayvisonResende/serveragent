[project]
name = "sentinel"
version = "0.1.0"
description = "Agente local de administração, monitoramento e manutenção de servidores Windows"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
    "psutil>=7,<8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "websockets>=13,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Cliente de testes do Starlette sugere o pacote httpx2; httpx segue funcional.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
