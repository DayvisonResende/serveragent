[project]
name = "sentinel"
version = "0.1.0"
description = "Agente local de administração, monitoramento e manutenção de servidores Windows"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
