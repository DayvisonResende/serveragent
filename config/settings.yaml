# Configuração do Sentinel.
# Caminhos relativos partem da raiz do projeto. Chaves desconhecidas são
# rejeitadas na inicialização. Valide com: python -m sentinel check-config

paths:
  data_dir: data                    # banco, trava de instância, backups
  log_dir: logs
  database_file: data/sentinel.db

logging:
  level: INFO                       # DEBUG | INFO | WARNING | ERROR
  max_bytes: 5242880                # tamanho de cada arquivo antes da rotação (5 MB)
  backup_count: 5                   # arquivos antigos mantidos
  console: true                     # ignorado sob pythonw.exe (sem console)

database:
  busy_timeout_ms: 5000
  integrity_check_on_start: true    # PRAGMA quick_check a cada inicialização

agent:
  heartbeat_interval_seconds: 30    # sinal de vida gravado no banco
  module_start_timeout_seconds: 15
  module_stop_timeout_seconds: 10
  shutdown_timeout_seconds: 10      # tempo para gravar eventos pendentes ao encerrar

event_bus:
  queue_size: 1000                  # eventos acima disso são descartados (e contados)
  handler_timeout_seconds: 5

scheduler:
  default_job_timeout_seconds: 30
  max_backoff_multiplier: 8         # teto do atraso após falhas consecutivas
  max_load_factor: 4                # quanto tarefas não essenciais podem desacelerar sob carga

monitoring:                         # intervalos de coleta (PRD 5.8)
  fast_interval_seconds: 5          # CPU, memória e rede — essencial, nunca desacelera
  disk_interval_seconds: 30
  process_interval_seconds: 15
  temperature_interval_seconds: 30
  persist_interval_seconds: 60      # médias gravadas no banco
  process_snapshot_interval_seconds: 300
  process_snapshot_top_n: 10        # processos que mais usam CPU e memória
  disk_history_interval_seconds: 1800
  live_history_seconds: 3600        # histórico em memória na resolução máxima
  collector_timeout_seconds: 10

alerts:
  cpu_percent: 90
  cpu_sustained_seconds: 60         # só alerta se durar isso
  memory_percent: 90
  memory_sustained_seconds: 30
  disk_free_warning_percent: 10
  disk_free_critical_percent: 5
  hysteresis_percent: 5             # margem para considerar normalizado

resources:                          # modo de baixa prioridade (PRD 13.3)
  pressure_cpu_percent: 80
  pressure_memory_percent: 90
  severe_cpu_percent: 95
  pressure_load_factor: 2           # tarefas não essenciais ficam 2x mais lentas
  severe_load_factor: 4
  smoothing_samples: 6              # média das últimas 6 amostras (30 s)
  hysteresis_percent: 10

servers:                            # gerenciamento de servidores (PRD 6)
  check_interval_seconds: 15
  failure_threshold: 2              # falhas seguidas antes de declarar problema (evita alarme falso)
  check_concurrency: 4
  stop_timeout_seconds: 10          # espera antes de forçar o encerramento
  operations_per_window: 5          # no máximo 5 operações por servidor...
  operations_window_seconds: 600    # ...a cada 10 minutos (evita ciclos de reinício)

security:                           # aprovações e vigilância (PRD 11)
  approval_ttl_minutes: 30          # solicitações expiram se ninguém decidir
  propose_server_restart: true      # servidor gerenciado caiu sem reinício automático → pede aprovação
  autostart_scan_minutes: 10        # verificação da inicialização automática (registro, tarefas, serviços)

ai:                                 # IA local via Ollama (PRD 9)
  ollama_url: http://127.0.0.1:11434   # somente neste computador
  model: hf.co/LiquidAI/LFM3-1.7B-GGUF:Q4_K_M   # escolhido pelo testar-ia.bat (4/4 ferramentas, 12 tokens/s)
  history_messages: 6               # mensagens anteriores enviadas ao modelo (contexto curto = mais rápido)
  max_tool_rounds: 3                # consultas encadeadas por pergunta (1 = mais rápido, mas a resposta piorou no teste)
  keep_alive_minutes: 5             # descarrega o modelo da memória após inatividade
  timeout_seconds: 180

storage:                            # análise de armazenamento e limpeza (PRD 8)
  analysis_interval_hours: 24       # análise automática; 0 = só quando você pedir no dashboard
  full_disk_view: true              # mede as pastas de todos os discos (só leitura; a limpeza fica nas pastas autorizadas)
  large_file_mb: 200                # a partir deste tamanho o arquivo entra em "arquivos grandes"
  temp_min_age_days: 7              # temporários mais novos que isso não são sugeridos
  log_min_age_days: 30              # logs antigos
  duplicate_min_mb: 1               # duplicados menores que isso são ignorados
  max_hash_gb: 4                    # leitura máxima de disco por análise para comparar duplicados
  quarantine_max_gb: 5              # espaço máximo da quarentena
  quarantine_retention_days: 30     # após isso, itens da quarentena são excluídos definitivamente

retention:                          # dias mantidos por categoria (PRD 16.2)
  metrics_days: 30
  process_snapshots_days: 7
  disk_history_days: 365
  events_days: 90
  server_checks_days: 7

api:
  enabled: true
  host: 127.0.0.1                   # somente local nesta versão
  port: 8765
  session_hours: 12                 # duração da sessão do dashboard
  login_code_seconds: 120           # validade do link de acesso de uso único
